<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ page.description | default: site.description }}" />
  <meta name="keywords" content="{{ page.keywords | default: site.keywords }}" />
  <link rel="canonical" href="{{ page.url | absolute_url }}" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="{{ page.title | default: site.title }}" />
  <meta property="og:description" content="{{ page.description | default: site.description }}" />
  <meta property="og:url" content="{{ page.url | absolute_url }}" />
  <meta property="og:site_name" content="{{ site.title }}" />
  <meta name="twitter:card" content="summary_large_image" />
  {% seo %}
  <link rel="stylesheet" href="{{ '/assets/styles.css' | relative_url }}" />
  <script>
    window.SITE_BASE_URL = {{ site.baseurl | jsonify }};
  </script>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js" defer></script>
  <script src="{{ '/assets/app.js' | relative_url }}" defer></script>
</head>
<body data-page="{{ page.page_key | default: 'default' }}">
  <header class="site-header">
    <div class="container header-wrap">
      <a class="brand" href="{{ '/' | relative_url }}">Awesome Bangladeshi Developers</a>
      <nav class="site-nav" aria-label="Primary">
        <a href="{{ '/' | relative_url }}">Home</a>
        <a href="{{ '/developers/' | relative_url }}">Bangladeshi Developers</a>
        <a href="{{ '/projects/' | relative_url }}">Bangladeshi Projects</a>
        <a href="{{ '/about/' | relative_url }}">About</a>
        <a href="{{ '/contact/' | relative_url }}">Contact</a>
      </nav>
    </div>
  </header>

  <main class="container page-main">
    {{ content }}
  </main>

  <footer class="site-footer">
    <div class="container footer-wrap">
      <p>© {{ "now" | date: "%Y" }} Awesome Bangladeshi Developers · Data-driven directory of Bangladesh’s open-source community.</p>
      <p><a href="{{ '/sitemap.xml' | relative_url }}">Sitemap</a> · <a href="{{ '/robots.txt' | relative_url }}">Robots</a></p>
    </div>
  </footer>
</body>
</html>
