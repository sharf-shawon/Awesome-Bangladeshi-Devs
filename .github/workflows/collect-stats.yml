name: Enrich Developer Data

on:
  schedule:
    - cron: '0 23 * * *' # Daily at 11 PM UTC
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Enricher
        env:
          GH_TOKENS: ${{ secrets.GH_TOKENS }}
        run: python src/enrich_data.py

      - name: Build Search Index
        run: python src/build_search_index.py

      - name: Commit generated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(data): enriched user data and search index"
            
            # Robust retry loop for pushing
            MAX_RETRIES=5
            for i in $(seq 1 $MAX_RETRIES); do
              echo "Push attempt $i..."
              if git push origin main; then
                echo "Push successful!"
                exit 0
              fi
              echo "Push rejected. Syncing with remote and retrying..."
              git fetch origin main
              git rebase origin/main
              sleep $((i * 2))
            done
            # We don't exit 1 here because we still want to try building the site with artifacts
            echo "Failed to push after $MAX_RETRIES attempts, but continuing to build."
          else
            echo "No changes to commit."
          fi

      - name: Upload enriched data
        uses: actions/upload-artifact@v4
        with:
          name: enriched-data
          path: data/*.json

  build_site:
    needs: enrich
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download enriched data
        uses: actions/download-artifact@v4
        with:
          name: enriched-data
          path: data/

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Eleventy Site
        run: npm run build

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './_site'

  deploy_site:
    needs: build_site
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
