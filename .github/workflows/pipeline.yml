name: Pipeline

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'LICENSE', '.gitignore']
  pull_request:
    branches: [main]
  issues:
    types: [opened, labeled, reopened, edited]
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  pages: write
  id-token: write

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate data
        run: python src/validate_data.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        run: npm ci

  test:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt pytest pytest-cov
      - name: Run tests
        run: pytest --cov=src --cov-report=xml -q

  process:
    needs: test
    if: github.event_name == 'issues' && (contains(github.event.issue.labels.*.name, 'add-developer') || contains(github.event.issue.labels.*.name, 'remove-developer'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Process issue
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_LABELS: ${{ join(github.event.issue.labels.*.name, ',') }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          RESULT=$(python src/process_issue.py)
          echo "PROCESS_RESULT=$RESULT" >> $GITHUB_ENV
          echo "Process result: $RESULT"
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/users.json data/removed_users.json
          git diff --cached --quiet || (git commit -m "chore(data): process issue #${{ github.event.issue.number }} [skip ci]" && git push)
      - name: Comment on issue
        uses: actions/github-script@v7
        with:
          script: |
            const result = process.env.PROCESS_RESULT;
            let body = "";
            if (result === "ADDED") body = "✅ Successfully added to the directory!";
            else if (result === "REMOVED") body = "👋 Successfully removed from the directory.";
            else if (result === "DUPLICATE") body = "ℹ️ You are already in the directory.";
            else if (result === "INVALID_LOCATION") body = "❌ Invalid location. Please ensure you are from Bangladesh or have strong ties.";
            else if (result === "BLOCKED") body = "🚫 This user is blocked from being added.";
            else if (result === "PROFILE_NOT_FOUND") body = "❌ GitHub profile not found. Please check the username.";
            else if (result === "MANUAL_REVIEW") body = "👀 This request requires manual review by a maintainer.";
            
            if (body) {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: body
              });
              
              if (["ADDED", "REMOVED", "DUPLICATE", "INVALID_LOCATION", "BLOCKED", "PROFILE_NOT_FOUND"].includes(result)) {
                github.rest.issues.update({
                  issue_number: context.issue.number,
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  state: 'closed'
                });
              }
            }

  build-and-deploy:
    needs: [process]
    if: |
      always() &&
      (github.event_name == 'push' || 
       github.event_name == 'workflow_dispatch' ||
       needs.process.result == 'success')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Generate README
        run: python src/generate_readme.py
      - name: Build search index
        run: python src/build_search_index.py
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
