name: Daily Enrichment

on:
  schedule:
    - cron: '0 23 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force re-enrichment of all users (ignore enriched_at)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Enrich data
        env:
          GH_TOKENS: ${{ secrets.GH_TOKENS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/enrich_data.py ${{ github.event.inputs.force_refresh == 'true' && '--force' || '' }}
      - name: Build search index
        run: python src/build_search_index.py
      - name: Generate README
        run: python src/generate_readme.py
      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/users-enriched.json data/search-index.json data/*.json README.md
          git diff --cached --quiet || (git commit -m "chore(data): daily enrichment [skip ci]" && git push)

  build-and-deploy:
    needs: enrich
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
