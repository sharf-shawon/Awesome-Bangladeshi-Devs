name: Daily Enrichment

on:
  schedule:
    - cron: '1 0 * * *'
  workflow_dispatch:
    inputs:
      force_refresh:
        description: 'Force re-enrichment of all users (ignore enriched_at)'
        type: boolean
        default: false

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Enrich data
        env:
          GH_TOKENS: ${{ secrets.GH_TOKENS }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python src/enrich_data.py ${{ github.event.inputs.force_refresh == 'true' && '--force' || '' }}
      - name: Build search index
        run: python src/build_search_index.py
      - name: Generate README
        run: python src/generate_readme.py
      - name: Commit and push changes
        id: commit_step
        run: |
          git config --global user.name "Sharfuddin Shawon"
          git config --global user.email "sharfuddin.shawon@gmail.com"
          git add data/users-enriched.json data/search-index.json data/*.json README.md
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "pushed=false" >> $GITHUB_OUTPUT
          else
            git commit -m "chore(data): daily enrichment [skip ci]"
            git push
            TAG_NAME=$(date +%Y-%m-%d)
            if git rev-parse "$TAG_NAME" >/dev/null 2>&1; then
              echo "Tag $TAG_NAME already exists, skipping tagging."
            else
              git tag "$TAG_NAME"
              git push origin "$TAG_NAME"
            fi
            echo "pushed=true" >> $GITHUB_OUTPUT
          fi

      - name: Create Release
        if: steps.commit_step.outputs.pushed == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME=$(date +%Y-%m-%d)
          if ! gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release create "$TAG_NAME" --title "Stats for $TAG_NAME" --notes "Daily data enrichment for $TAG_NAME"
          else
            echo "Release $TAG_NAME already exists"
          fi

  build-and-deploy:
    needs: enrich
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Node dependencies
        run: npm ci
      - name: Build site
        run: npm run build
      - name: Setup Pages
        uses: actions/configure-pages@v4
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
