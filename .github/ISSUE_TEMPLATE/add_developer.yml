name: Add Developer to Awesome List
description: Add a Bangladeshi developer to the directory
title: "[ADD] @{github_username}"
labels: ["add-developer"]
body:
  - type: input
    id: github_username
    attributes:
      label: GitHub Username
      placeholder: "e.g. torvalds"
    validations:
      required: true
  - type: input
    id: location
    attributes:
      label: Location
      description: "Must include Bangladesh or a Bangladeshi city"
      placeholder: "e.g. Dhaka, Bangladesh"
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: "I confirm this developer is from Bangladesh or has strong ties to Bangladesh"
          required: true
        - label: "I have read the contributing guidelines"
          required: true
